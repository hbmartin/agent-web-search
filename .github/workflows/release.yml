name: release
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "11.5.2"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "^22.22.2"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          expected_tag="v$(node --print "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            printf '::error::Release tag "%s" must match package version tag "%s".\n' "$RELEASE_TAG" "$expected_tag"
            exit 1
          fi
      - name: Install npm with trusted publishing support
        run: npm install --global npm@12.2.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm exec publint --pack npm
      - run: pnpm run check:browser
      - name: Publish to npm with trusted publishing
        env:
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          tag="latest"
          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            tag="next"
          fi
          npm publish --access public --provenance --tag "$tag"
